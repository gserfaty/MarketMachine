name: precompute

on:
  schedule:
    - cron: "0 15 22 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: precompute

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Train 3/12/24m forecasts on live data
        run: python -m housing.precompute "$RUNNER_TEMP/out"
      - name: Commit JSON to the forecasts branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init pub
          cd pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git checkout --orphan forecasts
          cp "$RUNNER_TEMP"/out/*.json .
          git add .
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Precomputed forecasts $(date -u +%F)"
          git push --force origin forecasts
